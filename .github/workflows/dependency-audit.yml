name: Dependency audit report

on:
  push:
    branches: [Develop]
  pull_request:
    branches: [Develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Report and validate npm dependency fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate baseline advisory report
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > npm-audit-before.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-before.json', 'utf8'));
          const entries = Object.entries(report.vulnerabilities ?? {});
          console.log('Baseline npm audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of entries) {
            const via = (item.via ?? []).map((entry) =>
              typeof entry === 'string' ? entry : `${entry.title ?? entry.name ?? 'Advisory'} (${entry.url ?? 'no advisory URL'})`
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: via,
            }));
          }
          NODE
      - name: Preserve baseline lockfile for review
        run: cp package-lock.json package-lock.before.json
      - name: Apply compatible fixes without major-version overrides
        run: npm audit fix --package-lock-only
      - name: Verify fixed dependency tree
        run: |
          npm ci
          npm run test
          npm run typecheck
          npm run lint
          npm run build
      - name: Generate post-fix advisory report
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > npm-audit-after.json || true
          node -e "const r=require('./npm-audit-after.json'); console.log('Post-fix npm audit summary:', JSON.stringify(r.metadata?.vulnerabilities ?? {}, null, 2));"
      - name: Upload candidate lockfile and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-fix-candidate-${{ github.sha }}
          path: |
            package-lock.before.json
            package-lock.json
            npm-audit-before.json
            npm-audit-after.json
          if-no-files-found: error
          retention-days: 14
