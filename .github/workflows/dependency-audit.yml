name: Dependency audit report

on:
  push:
    branches: [Develop]
  pull_request:
    branches: [Develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Report npm dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate advisory report
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > npm-audit.json || audit_exit=$?
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const entries = Object.entries(report.vulnerabilities ?? {});
          console.log('npm audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of entries) {
            const via = (item.via ?? []).map((entry) =>
              typeof entry === 'string' ? entry : `${entry.title ?? entry.name ?? 'Advisory'} (${entry.url ?? 'no advisory URL'})`
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: via,
            }));
          }
          NODE
      - name: Upload machine-readable audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
