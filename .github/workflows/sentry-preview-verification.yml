name: Sentry preview verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-preview-verification
  cancel-in-progress: false

jobs:
  verify-and-deploy-preview:
    name: Build, upload source maps and deploy a preview
    if: github.ref == 'refs/heads/Develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Develop
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate preview and Sentry credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$VERCEL_TOKEN" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "$VERCEL_ORG_ID" ]] || missing+=(VERCEL_ORG_ID)
          [[ -n "$VERCEL_PROJECT_ID" ]] || missing+=(VERCEL_PROJECT_ID)
          [[ -n "$VITE_SENTRY_DSN" ]] || missing+=(VITE_SENTRY_DSN)
          [[ -n "$SENTRY_AUTH_TOKEN" ]] || missing+=(SENTRY_AUTH_TOKEN)
          [[ -n "$SENTRY_ORG" ]] || missing+=(SENTRY_ORG)
          [[ -n "$SENTRY_PROJECT" ]] || missing+=(SENTRY_PROJECT)
          if (( ${#missing[@]} )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "$VERCEL_PROJECT_ID" != "prj_SC7efw9ydQkFaz305uXEUXzjOvg9" ]]; then
            echo "::error::VERCEL_PROJECT_ID does not match the canonical ems_frontend project."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull preview project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview

      - name: Build preview artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: https://employment-management-system-49la.onrender.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
          VITE_APP_RELEASE: ${{ github.sha }}-preview
        run: vercel build

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          static_dir=".vercel/output/static"
          test -d "$static_dir"
          if ! find "$static_dir" -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::No source maps found in the preview artifact."
            exit 1
          fi
          release="${GITHUB_SHA}-preview"
          npx --yes @sentry/cli sourcemaps inject "$static_dir"
          if ! npx --yes @sentry/cli releases info "$release" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" >/dev/null 2>&1; then
            npx --yes @sentry/cli releases new "$release" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          fi
          npx --yes @sentry/cli sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$release" "$static_dir"
          npx --yes @sentry/cli releases finalize "$release" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"

      - name: Deploy preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt
