name: Inspect dependency lockfile changes

on:
  pull_request:
    branches: [Develop]

permissions:
  contents: read

jobs:
  lockfile-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Generate lockfile and expose new package records
        shell: bash
        run: |
          cp package-lock.json /tmp/base-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const added = {};
          for (const [key, value] of Object.entries(next.packages)) {
            if (key !== '' && !base.packages[key]) added[key] = value;
          }
          console.log('SENTRY_LOCK_DELTA_BEGIN');
          console.log(Buffer.from(JSON.stringify({root: next.packages[''], added})).toString('base64'));
          console.log('SENTRY_LOCK_DELTA_END');
          NODE
