name: Branch name policy

# Branch flow:
#   feature/<name>  ->  develop  ->  main
# - Pull requests into develop must come from a feature/<name> branch.
# - Pull requests into main must come from develop.
# Mark "Enforce branch flow" as a required status check in the rulesets so
# GitHub blocks the merge when this check fails.
on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  check-branch-flow:
    name: Enforce branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate source and target branches
        env:
          # Passed through the environment, never inlined in the script,
          # because branch names are controlled by whoever opens the PR.
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          feature_pattern='^feature/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'

          case "$BASE_REF" in
            develop)
              if [[ "$HEAD_REF" =~ $feature_pattern ]]; then
                echo "OK: '$HEAD_REF' may be merged into develop."
              else
                echo "::error title=Invalid branch name::Branch '$HEAD_REF' cannot be merged into develop. Create your branch from develop and name it feature/<short-description>, for example feature/add-leave-filter."
                exit 1
              fi
              ;;
            main)
              if [[ "$HEAD_REF" == "develop" ]]; then
                echo "OK: develop may be promoted to main."
              else
                echo "::error title=Only develop can be merged into main::Branch '$HEAD_REF' cannot be merged into main. Open your pull request against develop instead."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected target branch '$BASE_REF'."
              exit 1
              ;;
          esac
